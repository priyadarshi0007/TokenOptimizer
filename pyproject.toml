[project]
name = "smart-delegate"
version = "0.1.0"
description = "Provider-agnostic token-cost optimizer for Claude Code: routes heavy file I/O and boilerplate generation to cheap worker models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3.0"]

[project.scripts]
smart-delegate = "smart_delegate.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smart_delegate*"]
